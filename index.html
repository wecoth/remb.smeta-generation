  /* ── TOPBAR PILL SWITCHER ─────────────────────────────── */
  .topbar-pill-wrap {

    position:relative;

    transition:transform .22s cubic-bezier(.4,0,.2,1), width .22s cubic-bezier(.4,0,.2,1);

    z-index:0;

  /* viewContainer (=.app-views) должен заполнять оставшееся место в app-shell */
  #viewContainer {

<script>
// Контекстное переключение панели инструментов
(function() {
  function syncCtxPanel(tool) {
    // Скрываем все контексты
    const ctxSelect = document.getElementById('ctxSelect');
    const ctxWall   = document.getElementById('ctxWall');
    const winP      = document.getElementById('windowParams');
    const doorP     = document.getElementById('doorParams');
    const editP     = document.getElementById('editPanel');
    const selEmpty  = document.getElementById('selectEmpty');

    [ctxWall, winP, doorP].forEach(el => { if(el) el.style.display = 'none'; });
    if (ctxSelect) ctxSelect.style.display = 'block';
    if (editP)     editP.style.display = 'none';
    if (selEmpty)  selEmpty.style.display = 'block';

    if (tool === 'wall') {
      ctxSelect.style.display = 'none';
      ctxWall.style.display = 'block';
    } else if (tool === 'window') {
      ctxSelect.style.display = 'none';
      winP.style.display = 'block';
    } else if (tool === 'door') {
      ctxSelect.style.display = 'none';
      doorP.style.display = 'block';
    }
  }

  // Экспортируем для вызова из tools.js (роутер вызывает после загрузки planner.html)
  window._syncCtxPanel = syncCtxPanel;
})();
</script>

<script type="module">
// ── MINI-ROUTER ────────────────────────────────────────────────────
// Загружает HTML вкладки в #viewContainer и инициализирует её логику

const viewContainer = document.getElementById('viewContainer');
const tabButtons    = document.querySelectorAll('.pill-btn');
const pillSlider    = document.getElementById('pillSlider');

// Кэш смонтированных вьюшек: { planner: HTMLElement, smeta: HTMLElement, kp: HTMLElement }
const mountedViews = {};
let currentView = null;

// ── Pill slider animation ─────────────────────────────────────────
function movePillSlider(btn) {
  const pill = document.getElementById('topbarPill');
  if (!pill || !pillSlider) return;
  const pillRect = pill.getBoundingClientRect();
  const btnRect  = btn.getBoundingClientRect();
  pillSlider.style.width     = btnRect.width + 'px';
  pillSlider.style.transform = 'translateX(' + (btnRect.left - pillRect.left - 3) + 'px)';
}

// ── Скрыть все смонтированные вьюшки ─────────────────────────────
function hideAllViews() {
  Object.values(mountedViews).forEach(el => { el.style.display = 'none'; });
}

// ── Загрузить и инициализировать вьюшку (только первый раз) ──────
async function mountView(viewName) {
  if (mountedViews[viewName]) return; // уже смонтирована

  const res  = await fetch('/views/' + viewName + '.html');
  const html = await res.text();

  // Создаём обёртку и вставляем HTML
  const wrapper = document.createElement('div');
  wrapper.dataset.view = viewName;
  wrapper.style.display = 'none';
  wrapper.innerHTML = html;

  // Переисполняем <script> теги (innerHTML их не запускает)
  wrapper.querySelectorAll('script').forEach(oldScript => {
    const newScript = document.createElement('script');
    [...oldScript.attributes].forEach(a => newScript.setAttribute(a.name, a.value));
    newScript.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });

  viewContainer.appendChild(wrapper);
  mountedViews[viewName] = wrapper;

  // Инициализация логики модуля
  if (viewName === 'planner') {
    try {
      // Грузим все модули параллельно
      const [
  { appState },
  up,
  { loadFromLocalStorage },
  { clearHistory },
] = await Promise.all([
  import('./js/state.js'),
  import('./js/ui-planner.js'),
  import('./js/storage.js'),                  // ← правильный модуль
  import('./js/commands/CommandHistory.js'),
]);
      
      window._appState = appState;
      const { initPlanner, forceRedraw, getViewport } = up;

      if (getViewport) {
        Object.defineProperty(window, '_plannerViewport', { get: () => getViewport(), configurable: true });
      }

      const canvas     = wrapper.querySelector('#planCanvas');
      const canvasWrap = wrapper.querySelector('#canvasWrap');
      if (canvas && canvasWrap) {
        initPlanner({
          canvas, canvasWrap,
          toolGrid:          wrapper.querySelector('#toolGrid'),
          offsetBtns:        wrapper.querySelector('#offsetBtns'),
          doorHingeButtons:  wrapper.querySelector('#doorHingeButtons'),
          doorSwingButtons:  wrapper.querySelector('#doorSwingButtons'),
          editPanel:         wrapper.querySelector('#editPanel'),
          editContent:       wrapper.querySelector('#editContent'),
          btnDeleteSelected: wrapper.querySelector('#btnDeleteSelected'),
          btnUndo:           wrapper.querySelector('#btnUndo'),
          btnRedo:           wrapper.querySelector('#btnRedo'),
          btnNew:            wrapper.querySelector('#btnNew'),
          btnRecalc:         wrapper.querySelector('#btnRecalc'),
          btnZoomIn:         wrapper.querySelector('#btnZoomIn'),
          btnZoomOut:        wrapper.querySelector('#btnZoomOut'),
          btnZoomReset:      wrapper.querySelector('#btnZoomReset'),
          btnImportRooms:    wrapper.querySelector('#btnImportRooms'),
          roomCount:         wrapper.querySelector('#roomCount'),
          lblTool:           wrapper.querySelector('#lblTool'),
          lblCoords:         wrapper.querySelector('#lblCoords'),
          lblLen:            wrapper.querySelector('#lblLen'),
          lblLenVal:         wrapper.querySelector('#lblLenVal'),
          snapBadge:         wrapper.querySelector('#snapBadge'),
          lengthOverlay:     wrapper.querySelector('#lengthOverlay'),
          lengthLabel:       wrapper.querySelector('#lengthLabel'),
          inpWallThick:      wrapper.querySelector('#inpWallThick'),
          inpWallHeight:     wrapper.querySelector('#inpWallHeight'),
          rulerTooltip:      wrapper.querySelector('#rulerTooltip'),
        });
      }

      if (loadFromLocalStorage()) {
        clearHistory();
        forceRedraw();
        // Пересчитываем комнаты после восстановления стен из localStorage
        const { EventBus } = await import('./js/eventBus.js');
        EventBus.emit('walls:changed');
      }

      // Привязываем syncCtxPanel к toolGrid этой вьюшки
      const toolGrid = wrapper.querySelector('#toolGrid');
      if (toolGrid && window._syncCtxPanel) {
        toolGrid.addEventListener('click', e => {
          const btn = e.target.closest('[data-tool]');
          if (btn) setTimeout(() => window._syncCtxPanel(btn.dataset.tool), 0);
        });
        window._syncCtxPanel('select');
      }

    } catch(e) { console.error('Planner init error:', e); }

  } else if (viewName === 'smeta') {
    try {
      const { appState } = await import('./js/state.js');
      window._appState = appState;

      const sm = await import('./js/smeta.js');
      const { initSmeta,
        handleSmr, initSmrManual, addSmrRow, clearSmr,
        handleMat, initMatManual, addMatRow, clearMat,
        generatePDF, importRoomsFromPlanner, captureCanvas,
        collectSmrRows, collectMatRows, getSmrTotal, getMatTotal,
        setSmrMode, setGanttMode,
        toggleCollapseAllSmr, toggleCollapseAllMat,
      } = sm;

      window._smetaModule = {
        handleSmr, initSmrManual, addSmrRow, clearSmr,
        handleMat, initMatManual, addMatRow, clearMat,
        generatePDF, importRoomsFromPlanner, captureCanvas,
        collectSmrRows, collectMatRows, getSmrTotal, getMatTotal,
        setSmrMode, setGanttMode,
        toggleCollapseAllSmr, toggleCollapseAllMat,
      };

      const { renderToImage } = await import('./js/render.js');
      window._renderModule = { renderToImage };

      initSmeta();

      // ── Автообновление КП при изменении данных сметы ──────────
      const { EventBus } = await import('./js/eventBus.js');
      EventBus.on('state:smrRows:changed', () => {
        if (window._smetaModule?.liveUpdate) window._smetaModule.liveUpdate();
      });
      EventBus.on('state:matRows:changed', () => {
        if (window._smetaModule?.liveUpdate) window._smetaModule.liveUpdate();
      });
      EventBus.on('state:rooms:changed', () => {
        if (window._smetaModule?.liveUpdate) window._smetaModule.liveUpdate();
      });
      EventBus.on('state:stages:changed', () => {
        if (window._smetaModule?.liveUpdate) window._smetaModule.liveUpdate();
      });

      // Автозаполнение поля "Смета сформирована" = сегодня
      (function fillSmetaDate() {
        const todayIso = new Date().toISOString().slice(0, 10);
        function tryFill() {
          const el = document.getElementById('smetaDate');
          if (el && !el._userEdited) {
            el.value = todayIso;
            el.addEventListener('change', function() { el._userEdited = true; }, { once: true });
          }
        }
        tryFill();
        [100, 300, 600, 1200].forEach(ms => setTimeout(tryFill, ms));
      })();
    } catch(e) { console.error('Smeta init error:', e); }

  } else if (viewName === 'kp') {
    // SPP toggles
    wrapper.querySelectorAll('#sppToggles input[type="checkbox"]').forEach(inp => {
      inp.addEventListener('change', () => {
        const page  = inp.dataset.page;
        const label = inp.closest('.spp-toggle');
        const pageEl = wrapper.querySelector('.spp-page[data-page="' + page + '"]');
        if (inp.checked) { label.classList.add('active'); pageEl?.classList.remove('spp-hidden'); }
        else             { label.classList.remove('active'); pageEl?.classList.add('spp-hidden'); }
      });
    });

    // ── Загружаем модуль заполнения КП и вызываем его ──────────
    try {
      const { liveUpdateKP } = await import('./js/smeta/kp-preview.js');

      // Сохраняем глобально — auth.js и другие модули могут вызвать liveUpdate()
      window._smetaModule = window._smetaModule || {};
      window._smetaModule.liveUpdate = liveUpdateKP;

      // Заполняем страницы КП сразу после монтирования
      setTimeout(() => {
        liveUpdateKP();
        if (typeof window.setA4Scale === 'function') window.setA4Scale();
        setTimeout(window.setA4Scale, 80);
      }, 80);
    } catch(e) {
      console.error('KP preview init error:', e);
      setTimeout(() => {
        if (typeof window.setA4Scale === 'function') window.setA4Scale();
      }, 80);
    }
  }
}

// ── Показать нужную вьюшку ────────────────────────────────────────
async function loadView(viewName) {
  await mountView(viewName); // если не смонтирована — монтируем

  hideAllViews();

  const el = mountedViews[viewName];
  el.style.display = 'block';
  currentView = viewName;

  // При показе планировщика — форсируем resize canvas
  if (viewName === 'planner') {
    requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
  }

  // При показе KP — A4 масштаб, сброс скролла и обновление данных
  if (viewName === 'kp') {
    const sppBody = el.querySelector('#sppBody');
    if (sppBody) sppBody.scrollTop = 0;
    // Обновляем КП при каждом переходе на вкладку (не только при первом монтировании)
    if (window._smetaModule?.liveUpdate) {
      window._smetaModule.liveUpdate();
    }
    requestAnimationFrame(() => {
      if (typeof window.setA4Scale === 'function') {
        window.setA4Scale();
        setTimeout(window.setA4Scale, 80);
      }
    });
  }
}

// ── Tab click handlers ────────────────────────────────────────────
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    movePillSlider(btn);
    loadView(btn.dataset.view);
  });
});

// ── Pill slider init (no transition on first paint) ───────────────
requestAnimationFrame(() => {
  const active = document.querySelector('.pill-btn.active');
  if (active) {
    pillSlider.style.transition = 'none';
    movePillSlider(active);
    requestAnimationFrame(() => { pillSlider.style.transition = ''; });
  }
});

// ── Save/load project buttons (wired to storage module) ──────────
async function wireStorageButtons() {
  const { autosaveToLocalStorage, downloadProject, uploadProject } = await import('./js/storage.js');
  const { clearHistory } = await import('./js/commands/CommandHistory.js');

  document.getElementById('btnSaveProject')?.addEventListener('click', downloadProject);
  document.getElementById('btnLoadProject')?.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    uploadProject(f, err => {
      if (err) { alert('Ошибка загрузки: ' + err.message); return; }
      clearHistory();
      // Перерисовываем планировщик и пересчитываем комнаты
      import('./js/ui-planner.js').then(({ forceRedraw }) => forceRedraw()).catch(() => {});
      import('./js/eventBus.js').then(({ EventBus }) => EventBus.emit('walls:changed')).catch(() => {});
      // Если смета открыта — перерисовываем её с загруженными данными
      import('./js/smeta.js').then(({ initSmeta }) => {
        if (window._smetaModule) initSmeta();
      }).catch(() => {});
    });
  });
  setInterval(autosaveToLocalStorage, 30000);
}
wireStorageButtons();

// ── Preload GOST font ─────────────────────────────────────────────
try { await document.fonts.load('16px Merriweather'); } catch(e) {}

// ── Initial load: active tab ──────────────────────────────────────
const activeBtn = document.querySelector('.pill-btn.active');
if (activeBtn) await loadView(activeBtn.dataset.view);

// ── Фоновый preload модулей планировщика ──────────────────────────
// Запускаем сразу после первой вьюшки — браузер закачает и закэширует
// модули пока пользователь смотрит на смету, и при клике «Чертёж»
// import() вернётся мгновенно из кэша.
setTimeout(() => {
  import('./js/ui-planner.js').catch(() => {});
  import('./js/state.js').catch(() => {});
  import('./js/room.js').catch(() => {});
  import('./js/storage.js').catch(() => {});
  import('./js/commands/CommandHistory.js').catch(() => {});
  fetch('/views/planner.html').catch(() => {});
}, 800); // небольшая задержка чтобы не конкурировать с текущей вьюшкой

// ── KP scroll reset (smeta.js calls liveUpdate which populates KP) ─
function resetSppScroll() {
  const b = document.getElementById('sppBody');
  if (b) b.scrollTop = 0;
}
[50, 200, 600].forEach(t => setTimeout(resetSppScroll, t));
</script>
